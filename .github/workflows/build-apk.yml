name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/GymFlow-Demo-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymFlow-Demo-APK
          path: release-apk/GymFlow-Demo-v1.0.3.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "GymFlow Demo v1.0.3 (Zymist Edition)"
          body: |
            ### 🏋️‍♂️ Zymist GymFlow v1.0.3 — Release & Updates

            Download the updated Android APK below to install GymFlow directly on any Android smartphone or tablet:

            * 📱 **APK Direct Download**: [GymFlow-Demo-v1.0.3.apk](https://github.com/uniqabhishek/gymflow-automation/releases/download/v1.0.3/GymFlow-Demo-v1.0.3.apk)
            * 🌐 **Live Web Demo**: [https://uniqabhishek.github.io/gymflow-automation/](https://uniqabhishek.github.io/gymflow-automation/)

            #### What's New in v1.0.3:
            - ⚡ **Brand-New "Zymist" Power Gym Logo**:
              - High-energy hexagonal power emblem with stylized dumbbell & lightning 'Z' bolt.
            - 📞 **Developer Contact Verified**:
              - Developer & Owner: **Abhishek**
              - WhatsApp (WhatsApp Only): **+91 9499268312**
              - Official UPI ID: **9499268312@slc**
            - 🛡️ **Zero Over-Scroll & Zero Top Whitespace Gap**:
              - Fixed the mobile sliding/rubber-band glitch where empty white space appeared on top.
              - Implemented `overscroll-behavior: none` and flush safe-area top inset padding on the sticky header.
            - 🎨 **Clean, Eye-Catching Athletic Theme**:
              - Refined contrast, deep obsidian `#080b11` in dark mode, crisp porcelain in light mode.
              - High-impact neon mint and emerald accents for CTAs.
          files: release-apk/GymFlow-Demo-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
