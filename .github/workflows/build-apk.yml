name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/GymFlow-Demo-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymFlow-Demo-APK
          path: release-apk/GymFlow-Demo-v1.0.1.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "GymFlow Demo v1.0.1 (Android APK)"
          body: |
            ### 🏋️‍♂️ GymFlow — Client Sales Demo & Smart Gym Expiry Automation System
            
            Download the official Android APK below to install GymFlow directly on any Android smartphone or tablet:
            
            * 📱 **APK Direct Download**: [GymFlow-Demo-v1.0.1.apk](https://github.com/uniqabhishek/gymflow-automation/releases/download/v1.0.1/GymFlow-Demo-v1.0.1.apk)
            * 🌐 **Live Web Demo**: [https://uniqabhishek.github.io/gymflow-automation/](https://uniqabhishek.github.io/gymflow-automation/)
            
            #### Features Included:
            - ✨ Clean, Minimalist, Modern SaaS UI (Light & Dark theme)
            - 📱 Mobile-First Native App Layout with Sticky Bottom Navigation & FAB
            - 💼 Turnkey Gym Owner Pitch & Sales Presentation Mode
            - 📲 Live WhatsApp Demo (Sends real test reminders to the owner's phone)
            - 💰 Interactive Lost Revenue & ROI Calculator
            - 💳 Instant UPI QR Code Generation & 1-Click Renewal
            - 🌅 Daily 9:00 AM Owner Morning Briefing
            - 🔄 Downloadable n8n Automation Workflow JSON
          files: release-apk/GymFlow-Demo-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
